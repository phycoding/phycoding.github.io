<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name=viewport content="width=device-width, initial-scale=1">
    <!-- Redirect to new site after 3 seconds -->
    <meta http-equiv="refresh" content="3;url=https://www.example.com">
    <!--[if lt IE 9]><script src="http://html5shiv.googlecode.com/svn/trunk/html5.js"></script><![endif]-->
    <script type="text/javascript">
        // JavaScript redirect as a fallback and for better control
        // Replace 'https://www.example.com' with your actual target URL
        var redirectUrl = 'https://www.example.com';
        var redirectDelay = 3000; // 3 seconds in milliseconds
        
        setTimeout(function() {
            window.location.href = redirectUrl;
        }, redirectDelay);
    </script>
    <style>
        body { margin: 0; padding: 0; }
        html { height: 100%; cursor: default; }
        body {
            font-family: "Roboto", sans-serif; /* Default font */
            width: 100%; height: 100%;
            text-align: center;
            display: table;
            opacity: 1;
            animation: fadein 3s forwards;
        }
        h2 {
            font-weight: 300;
            margin-bottom: 25px;
        }
        img {
            width: 25%; /* Image width */
            border: 0; /* For IE */
            /* Aspect ratio of image, gives initial dimension to prevent text moving down once image is loaded */
            /* When changing logo, change this also */
            aspect-ratio: 125 / 50;
        }
        #main {
            vertical-align: middle;
            display: table-cell;
        }
        /* Progress bar */
        #progress {
            width: 45%; /* Bar width */
            margin: 0 auto;
            border-radius: 10px; /* Roundness */
            background-color: #a8a8a8; /* Background colour */
            padding: 7px 5px;
            /* border: 5px solid #a8a8a8; Border */
        }
        #fill {
            padding: 2px 0;
            background-color: #00b98b; /* Fill colour */
            width: 100%; /* Bar percentage, changed to 100% for redirect */
            border-radius: 25px; /* Roundness */
            animation: proanimate 2s;
        }
        #barpercent h3 {
            color: white; /* Bar percentage text colour */
            margin: 0; padding: 0;
            opacity: 1;
            animation: fadein 3s forwards;
        }

        /* Fades in animation */
        @keyframes fadein  {
            from { opacity: 0; }
        }
        /* Animates bar on page load */
        @keyframes proanimate {
            from { width: 0%; }
        }

        @media screen and (max-width:600px) {
            img {
                width: 60%;
            }
            h1 {
                font-size: 1.3em;
            }
            h2 {
                margin: 1.1em;
                font-size: 1.1em;
            }
            #progress {
                width: 99%; /* Bar width */
            }
        }
    </style>
    <title>Coming Soon</title>
</head>
<body>
    <div id="main">
        <img src="logo.png" alt="Logo Image">
        <h1>Engineers Without Borders OUTR Student chapter</h1>
        <h2>We're redirecting you to our new website...</h2>
        <p style="margin-top: 20px; font-size: 0.9em; color: #666;">
            You will be automatically redirected in <span id="countdown">3</span> seconds.<br>
            If you are not redirected, <a href="https://www.example.com" style="color: #00b98b;">click here</a>.
        </p>
        <div id="progress"><div id="fill"><div id="barpercent"><h3>100%</h3></div></div></div>
    </div>
    <script>
        // Countdown timer
        var seconds = 3;
        var countdownElement = document.getElementById('countdown');
        var countdownInterval = setInterval(function() {
            seconds--;
            if (seconds > 0) {
                countdownElement.textContent = seconds;
            } else {
                clearInterval(countdownInterval);
            }
        }, 1000);
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400&display=swap" rel="stylesheet">
</body>
</html>
